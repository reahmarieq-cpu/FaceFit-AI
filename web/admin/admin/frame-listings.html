<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame Review · FaceFit AI Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

<div id="app-shell" data-active="frames" data-title="Frame Review" data-subtitle="Moderate frame listings submitted by shops" data-search="on">
<div id="page-content">
  <div class="pill-bar" id="filter-bar">
    <button class="filter-pill active" data-filter="pending">Pending <span class="pill-count" id="count-pending">0</span></button>
    <button class="filter-pill" data-filter="all">All submissions <span class="pill-count" id="count-all">0</span></button>
    <button class="filter-pill" data-filter="approved">Valid <span class="pill-count" id="count-approved">0</span></button>
    <button class="filter-pill" data-filter="hidden">Hidden <span class="pill-count" id="count-hidden">0</span></button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="ff-table">
        <thead>
          <tr><th>Frame</th><th>Shop</th><th>Status</th><th class="th-end">Moderate</th></tr>
        </thead>
        <tbody id="frames-tbody"></tbody>
      </table>
    </div>
    <div id="loading-state" class="state-msg">Loading frame submissions…</div>
    <div id="empty-state" class="state-msg d-none">No frame submissions found for this filter.</div>
    <div id="error-state" class="alert alert-danger m-4 d-none" role="alert"></div>
  </div>
</div>
</div>

<script type="module" src="../assets/js/frame-listings.js"></script>
</body>
</html>
