<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Catalog · FaceFit AI Shop</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo1.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="catalog">
  <div class="app-shell">
    <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
      <a class="brand" href="dashboard.html">
        <img class="brand__logo" src="assets/images/logo1.svg" alt="FaceFit AI logo">
        <span class="brand__stack"><strong>FaceFit AI</strong><span>Shop</span></span>
      </a>
      <p class="sidebar-label">MANAGE</p>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
        <a class="sidebar-link is-active" href="catalog.html"><i class="bi bi-eyeglasses"></i>Frame Catalog</a>
        <a class="sidebar-link" href="add-frame.html"><i class="bi bi-plus-lg"></i>Add Frame</a>
        <a class="sidebar-link" href="profile.html"><i class="bi bi-shop"></i>Shop Profile</a>
      </nav>
      <div class="shop-chip">
        <span class="shop-chip__avatar" id="shopInitials">CV</span>
        <span class="shop-chip__text">
          <span class="shop-chip__name" id="shopName">ClearView Optical</span>
          <span class="shop-chip__role">Approved shop</span>
        </span>
        <button type="button" class="shop-chip__logout" id="logoutButton" aria-label="Sign out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" class="topbar-toggle" id="sidebarToggle" aria-label="Open navigation"><i class="bi bi-list"></i></button>
        <div class="topbar-heading">
          <h1 class="topbar-heading__title">Frame Catalog</h1>
          <p class="topbar-heading__subtitle">Manage every listing in your shop</p>
        </div>
        <form class="search-box" id="topbarSearchForm" role="search">
          <i class="bi bi-search"></i>
          <input type="search" id="topbarSearchInput" placeholder="Search frames..." aria-label="Search frames">
        </form>
        <div class="dropdown">
          <button type="button" class="icon-button" id="notificationButton" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notifications">
            <i class="bi bi-bell"></i><span class="icon-button__dot" id="notificationDot"></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end notification-menu" id="notificationList"></ul>
        </div>
      </header>

      <main class="app-content">
        <div class="catalog-toolbar">
          <div class="filter-pills" id="statusFilterPills" role="group" aria-label="Filter by status">
            <button type="button" class="filter-pill is-active" data-status-filter="all">All</button>
            <button type="button" class="filter-pill" data-status-filter="live">Live</button>
            <button type="button" class="filter-pill" data-status-filter="pending">Pending</button>
            <button type="button" class="filter-pill" data-status-filter="draft">Draft</button>
          </div>
          <a class="btn btn-brand" href="add-frame.html"><i class="bi bi-plus-lg"></i>Add Frame</a>
        </div>

        <div class="row g-3" id="frameGrid"></div>

        <div class="empty-state d-none" id="catalogEmptyState">
          <i class="bi bi-eyeglasses"></i>
          <p class="mt-2 mb-0">No frames match your filters.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="modal fade" id="deleteFrameModal" tabindex="-1" aria-labelledby="deleteFrameTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0" style="border-radius: 20px;">
        <div class="modal-body text-center p-4">
          <h5 class="fw-bold" id="deleteFrameTitle">Delete this frame?</h5>
          <p class="small text-secondary mb-4">"<span id="deleteFrameName"></span>" will be removed from your catalog.</p>
          <div class="d-flex gap-2">
            <button type="button" class="btn-light-pill flex-fill" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger rounded-pill flex-fill fw-bold" id="confirmDeleteButton">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/frame-icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
