<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame Catalog · FaceFit AI Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

<div id="app-shell" data-active="catalog" data-title="Frame Catalog" data-subtitle="Maintain the centralized frame catalog" data-search="on">
<div id="page-content">
  <div class="eyebrow">Master catalog</div>
  <h2 class="section-title" id="catalog-heading">Loading catalog…</h2>

  <div id="action-feedback" class="alert d-none" role="alert"></div>

  <div class="panel">
    <div class="table-wrap">
      <table class="ff-table">
        <thead>
          <tr><th>Frame</th><th>Shop</th><th>Shape</th><th>Status</th><th class="th-end">Actions</th></tr>
        </thead>
        <tbody id="catalog-tbody"></tbody>
      </table>
    </div>
    <div id="loading-state" class="state-msg">Loading catalog…</div>
    <div id="empty-state" class="state-msg d-none">No validated frames in the catalog yet.</div>
    <div id="error-state" class="alert alert-danger m-4 d-none" role="alert"></div>
  </div>
</div>
</div>

<script type="module" src="../assets/js/frame-catalog.js"></script>
</body>
</html>
