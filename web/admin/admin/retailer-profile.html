<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retailer Profile · FaceFit AI Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

<div id="app-shell" data-active="retailer-list" data-title="Retailer Profile" data-subtitle="Review the submitted information before making a decision" data-search="off">
<div id="page-content" class="review-detail-page">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <a href="retailer-list.html" class="back-link mb-0"><i class="bi bi-arrow-left"></i> Back to Retailer Profiles</a>
    <span id="status-badge" class="badge-status badge-status-pending">Pending</span>
  </div>


      

      <!-- Loading state -->
      <div id="loading-state" class="text-center text-muted-ff py-5">
        Loading retailer application…
      </div>

      <!-- Error state (e.g. not found, no permission) -->
      <div id="error-state" class="alert alert-danger d-none" role="alert"></div>

      <!-- Compact, responsive retailer overview -->
      <div id="detail-content" class="d-none retailer-overview">
        <div class="retailer-overview-grid">
          <section class="panel retailer-overview-panel" aria-labelledby="retailer-info-title">
            <div class="overview-section-heading"><i class="bi bi-shop"></i><h2 id="retailer-info-title">Retailer information</h2></div>
            <div class="overview-fields">
              <div><div class="field-label">Retail name</div><div class="field-value" id="field-retailName">—</div></div>
              <div><div class="field-label">Contact person</div><div class="field-value" id="field-contactPerson">—</div></div>
              <div><div class="field-label">Phone</div><div class="field-value" id="field-contactNumber">—</div></div>
              <div><div class="field-label">Email</div><div class="field-value" id="field-emailAddress">—</div></div>
              <div class="overview-wide"><div class="field-label">Shop address</div><div class="field-value" id="field-retailAddress">—</div></div>
              <div><div class="field-label">Registered</div><div class="field-value" id="field-createdAt">—</div></div>
            </div>
          </section>
          <div class="retailer-overview-side">
            <section class="panel retailer-overview-panel">
              <div class="overview-section-heading"><i class="bi bi-file-earmark-check"></i><h2>Business permit</h2></div>
              <div id="field-permit" class="permit-preview overview-permit">—</div>
            </section>
            <section class="panel retailer-overview-panel">
              <div class="overview-section-heading"><i class="bi bi-credit-card"></i><h2>Subscription</h2></div>
              <div class="overview-fields">
                <div><div class="field-label">Plan</div><div class="field-value" id="field-subscriptionPlan">—</div></div>
                <div><div class="field-label">Status</div><div class="field-value" id="field-subscriptionStatus">—</div></div>
              </div>
            </section>
          </div>
        </div>
      </div>
    
</div>
</div>

<script type="module" src="../assets/js/retailer-profile.js"></script>
<style>
.retailer-overview-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;align-items:start}.retailer-overview-side{display:grid;gap:16px}.retailer-overview-panel{padding:20px 22px;border-radius:16px;border:1px solid #e3ecf0;box-shadow:0 5px 22px rgba(18,54,72,.05)}.overview-section-heading{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e9eff2;padding-bottom:12px;margin-bottom:16px;color:#148ca0}.overview-section-heading h2{font-size:15px;font-weight:800;margin:0;color:#173849}.overview-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}.overview-wide{grid-column:1/-1}.retailer-overview .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#728d9a;margin-bottom:5px}.retailer-overview .field-value{font-size:13px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}.overview-permit .permit-photo{width:100%;max-width:180px;max-height:150px;object-fit:contain;padding:6px;background:#f4f7f9;cursor:zoom-in}.overview-permit p{font-size:12px;margin:0 0 8px}.overview-permit a{font-size:12px}.retailer-overview .panel{margin:0!important}@media(max-width:950px){.retailer-overview-grid{grid-template-columns:1fr}}@media(max-width:540px){.overview-fields{grid-template-columns:1fr}.retailer-overview-panel{padding:16px}}
</style>
</body>
</html>
